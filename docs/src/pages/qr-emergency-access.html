<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emergency Medical Info | Digital Clinic Book</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

  <header class="site-header emergency">
    <h1>Emergency Medical Info</h1>
    <p class="tagline">Enter the code from the patient's card or QR label</p>
  </header>

  <main class="emergency-main">

    <section class="card emergency-lookup">
      <label>
        Emergency Code
        <input type="text" id="qr-token" placeholder="e.g. 8f3a1c9e2b7d4f0a" autocomplete="off" />
      </label>
      <button class="btn danger" id="load-emergency-btn">Show Emergency Info</button>
    </section>

    <section id="emergency-data"></section>

    <section class="card" id="full-access-section" style="display:none;">
      <button class="btn" id="full-record-btn">
        View Full Medical History
      </button>
    </section>

  </main>

  <footer class="site-footer">
    <p>Digital Clinic Book demo — all data shown is fictional, for demonstration only. Not for real medical use.</p>
    <p><a href="../../index.html">Home</a></p>
  </footer>

  <script type="module" src="../js/qr/qr-emergency.js"></script>
</body>
</html>
